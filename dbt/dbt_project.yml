name: ptit_dashboard
version: "0.1.0"
config-version: 2

profile: ptit_dashboard

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  ptit_dashboard:
    # Tầng chuẩn hoá: view cho nhẹ, không nhân bản dữ liệu thô.
    staging:
      +schema: stg
      +materialized: view
    # Tầng logic trung gian: view, KHÔNG expose ra ngoài. Backend không được đọc tầng này.
    intermediate:
      +schema: int
      +materialized: view
    # Tầng phục vụ dashboard: bảng thật, vì backend đọc trực tiếp và cần nhanh.
    marts:
      +schema: mart
      +materialized: table

# Seed là dữ liệu do NGƯỜI nhập, không phải do job thu thập. Mỗi dòng bắt buộc có
# `nguon_url` để hội đồng nghiệm thu mở lại được — seed không có trích dẫn thì không
# phân biệt được với số bịa.
seeds:
  ptit_dashboard:
    +schema: seed
