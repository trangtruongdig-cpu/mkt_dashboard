version: 2

seeds:
  - name: hoc_phi_doi_sanh
    description: >
      Học phí nhóm trường đối sánh, NHẬP TAY kèm đường dẫn nguồn.

      Tồn tại vì ba trường (Bách khoa, Công nghệ ĐHQGHN, FPT) để bảng học phí cho
      JavaScript dựng — HTML tĩnh không có thẻ <table> nào và không có con số tiền nào,
      nên crawler HTTP không lấy được. UIT thì để trong bảng nhiều năm trong PDF.
      Dựng trình duyệt không đầu để lấy sáu con số đổi một lần mỗi năm là không tương
      xứng; nhập tay kèm trích dẫn vừa rẻ hơn vừa kiểm chứng lại được.

      Dòng để trống giá trị là HÀNG ĐỢI CÔNG VIỆC: nó đã mang sẵn đường dẫn nguồn để
      người điền mở ra và chép đúng một con số, không phải đi tìm lại.
    config:
      # Mọi cột tiền khai tường minh. Để dbt tự đoán thì cột toàn ô trống bị suy ra
      # thành integer, và phép so sánh chuỗi ở model phía sau hỏng ngay.
      column_types:
        ma_truong: varchar
        nam: integer
        he_dao_tao: varchar
        hoc_phi: bigint
        hoc_phi_can_tren: bigint
        don_vi_hoc_phi: varchar
        nguon_url: varchar
        ngay_kiem_nguon: date
        ghi_chu: varchar
    columns:
      - name: ma_truong
        description: Khoá thương hiệu trong nhóm sáu trường đối sánh.
        tests: [not_null]
      - name: nguon_url
        description: >
          BẮT BUỘC. Seed không có trích dẫn thì không phân biệt được với số bịa — hội
          đồng nghiệm thu phải mở lại được từ con số về trang công bố.
        tests: [not_null]
      - name: ngay_kiem_nguon
        description: Ngày người nhập mở đường dẫn và xác nhận nó còn sống.
        tests: [not_null]
      - name: don_vi_hoc_phi
        description: Để trống khi chưa điền giá trị.
        tests:
          - accepted_values:
              arguments:
                values: [chinh_quy, tin_chi, nam, thang, hoc_ky]
                quote: true
              config:
                where: "don_vi_hoc_phi is not null"

  - name: quy_mo_nganh
    description: >
      Quy mô lĩnh vực Máy tính & CNTT toàn quốc — MẪU SỐ của tầng tăng trưởng.

      Khung IBMC bài 2.3: tăng trưởng của thương hiệu chỉ có nghĩa khi đặt cạnh tăng
      trưởng của ngành. Tăng chậm hơn ngành là ĐANG MẤT thị phần dù số tuyệt đối vẫn
      tăng. Không có bảng này thì `category_enrolment_growth` và `growth_vs_category_gap`
      không bao giờ có số, và bảng điều khiển có thể xanh toàn bộ trong khi Học viện
      đang mất thị phần.

      Để trống có chủ ý: con số 154.016 đang được trích trong rationale của mục tiêu
      biz_choice nhưng tôi KHÔNG xác minh được tại nguồn báo chí được dẫn — trang tải
      về không chứa con số nào. Ghi số chưa kiểm vào kho còn tệ hơn để trống, vì nó
      trông y hệt số đã kiểm.
    config:
      column_types:
        ma_chi_so: varchar
        nam: integer
        gia_tri: bigint
        don_vi: varchar
        nguon_url: varchar
        ngay_kiem_nguon: date
        ghi_chu: varchar
    columns:
      - name: ma_chi_so
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [category_registrations, category_admissions]
      - name: nam
        tests: [not_null]
      - name: ghi_chu
        description: Bắt buộc — nói rõ con số đến từ đâu, hoặc vì sao còn trống.
        tests: [not_null]

