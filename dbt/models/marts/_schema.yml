version: 2

models:
  - name: mart__channel_performance
    description: >
      Hiệu quả từng kênh theo ngày. Hợp đồng dữ liệu với backend cho các chỉ số
      thuộc tầng truyền thông.
    columns:
      - name: ngay
        description: Ngày báo cáo.
        tests: [not_null]
      - name: nhom_kenh
        description: Nhóm kênh mặc định của GA4.
        tests: [not_null]
      - name: la_direct
        description: >
          Phiên không quy được về kênh nào. Tỷ trọng cột này chính là mức thất thoát
          quy kết — càng cao thì UTM càng thiếu.
        tests: [not_null]
      - name: so_phien
        tests: [not_null]
      - name: ty_le_gan_ket_pct
        description: Phiên gắn kết trên tổng phiên, đơn vị %.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ngay, nhom_kenh]

  - name: mart__admission_funnel
    description: >
      Phễu tuyển sinh ba bậc, đo bằng lượt xem trang. Bậc sâu nhất là ý định nhập học —
      gần kết quả kinh doanh nhất trong toàn bộ dữ liệu đo được.
    columns:
      - name: ngay
        tests: [not_null]
      - name: bac
        description: Mã bậc phễu.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [can_nhac, y_dinh_dang_ky, nhap_hoc]
      - name: thu_tu_bac
        description: 1 → 3, dùng để sắp xếp khi vẽ phễu.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: so_luot_xem
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ngay, bac]

  - name: mart__program_demand
    description: >
      Nhu cầu theo ngành đào tạo. Trả lời được hai mục tiêu marketing mà trước đây
      phải chờ đề án tuyển sinh công bố hằng năm: cơ cấu nhóm ngành và tỷ trọng hệ
      giá trị cao — nay đo được hằng tuần.
    columns:
      - name: ngay
        tests: [not_null]
      - name: khoa_nganh
        description: Khoá ngành, khớp với seed nhom_nganh_dao_tao.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('nhom_nganh_dao_tao')
                field: khoa_nganh
      - name: nhom
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ict_core, media_creative, business_econ]
      - name: thuoc_loi
        description: Ngành có thuộc lõi công nghệ thông tin – viễn thông hay không.
        tests: [not_null]
      - name: he_gia_tri_cao
        description: Chương trình chất lượng cao, liên kết quốc tế hoặc chuẩn quốc tế.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ngay, khoa_nganh]

seeds:
  - name: nhom_nganh_dao_tao
    description: >
      Danh mục ngành và cách phân nhóm. Sinh từ apps/worker/config/programs.json để
      worker và dbt dùng chung một cách phân loại. Mở ngành mới thì sửa file JSON đó
      rồi sinh lại seed, đừng sửa CSV bằng tay.
    columns:
      - name: khoa_nganh
        tests: [unique, not_null]
      - name: nhom
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ict_core, media_creative, business_econ]

  - name: mart__brand_attention
    description: >
      Thị phần chú ý theo tuần, đo bằng lượt xem trang Wikipedia của nhóm sáu trường
      đối sánh. Nguồn công khai hoàn toàn, thay cho Google Trends đang chặn truy cập.
      Đây là tín hiệu SỚM: biến động theo tuần, trong khi kết quả tuyển sinh mỗi năm
      mới công bố một lần.
    columns:
      - name: tuan
        description: Ngày thứ Hai của tuần báo cáo. Chỉ có tuần trọn vẹn 7 ngày.
        tests: [not_null]
      - name: ma_truong
        description: Mã trường trong nhóm đối sánh.
        tests: [not_null]
      - name: so_luot_xem
        description: Số đếm tuyệt đối, đã loại lượt truy cập của bot (agent=user).
        tests: [not_null]
      - name: thi_phan_pct
        description: >
          Tỷ trọng trong tổng lượt xem của cả nhóm trong chính tuần đó. Đổi danh sách
          trường đối sánh là đổi mẫu số — số trước và sau khi đổi không so trực tiếp được.
      - name: la_hoc_vien
        description: Đánh dấu dòng của Học viện để giao diện làm nổi đúng một đường.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tuan, ma_truong]

  - name: mart__disclosure_benchmark
    description: >
      Số liệu đào tạo của nhóm đối sánh, bóc từ Biểu mẫu 18 mà mọi cơ sở giáo dục đại
      học buộc phải công khai theo Thông tư 09/2024/TT-BGDĐT. Giữ đúng một bản cho mỗi
      cặp (trường, năm), ưu tiên bản bóc sạch và đầy đủ nhất.
    columns:
      - name: ma_truong
        tests: [not_null]
      - name: nam
        description: Năm học được báo cáo, lấy năm đầu của cụm "năm học 2022-2023".
        tests: [not_null]
      - name: quy_mo_dao_tao
        description: Tổng người học mọi trình độ. Rỗng khi biểu mẫu đổi bố cục cột.
      - name: so_tot_nghiep
        description: Số sinh viên tốt nghiệp trong năm học.
      - name: ty_le_viec_lam_pct
        description: Tỷ lệ có việc làm trong 12 tháng sau tốt nghiệp, đơn vị %.
      - name: boc_sach
        description: >
          Đúng khi bóc không phát sinh cảnh báo nào. Sai nghĩa là có nghi ngờ về bố cục
          biểu mẫu — đọc cột `canh_bao` trước khi dùng con số để so sánh.
        tests: [not_null]
      - name: canh_bao
        description: Mọi chỗ đáng ngờ ghi nhận trong lúc bóc, ngăn cách bằng dấu " | ".
      - name: duong_dan_tai_lieu
        description: >
          Đường dẫn tài liệu gốc. Hội đồng nghiệm thu phải lần được từ con số trên màn
          hình về đúng tệp PDF đã sinh ra nó.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ma_truong, nam]

  - name: mart__social_sentiment
    description: >
      Phân bố sắc thái thảo luận của NGƯỜI NGOÀI về Học viện, theo tuần. Hợp đồng dữ
      liệu với backend cho chỉ số `positive_sentiment_share`.

      Đã loại bỏ nội dung do chính Học viện đăng (owned) và các hạt không mang ý kiến
      (tiêu đề, mô tả video). Mỗi thảo luận chỉ tính điểm của một phiên bản model.
    columns:
      - name: thang
        description: Ngày đầu tháng báo cáo.
        tests: [not_null]
      - name: phien_ban_model
        description: >
          Model và bản trọng số đã sinh ra các điểm này. Đổi model là đổi cách đọc số —
          không so trực tiếp hai tuần được chấm bằng hai phiên bản khác nhau.
        tests: [not_null]
      - name: so_thao_luan
        description: >
          Mẫu số. PHẢI hiển thị kèm mọi tỷ lệ phần trăm — một tháng 2 bản ghi và một tháng
          200 bản ghi cùng cho ra 100% tích cực, nhưng chỉ một trong hai là thông tin.
        tests: [not_null]
      - name: so_tich_cuc
        tests: [not_null]
      - name: so_trung_tinh
        tests: [not_null]
      - name: so_tieu_cuc
        tests: [not_null]
      - name: ty_le_tich_cuc_pct
        description: Thảo luận tích cực trên tổng, đơn vị %.
      - name: ty_le_tieu_cuc_pct
        description: Thảo luận tiêu cực trên tổng, đơn vị %.
      - name: do_chac_chan_tb
        description: >
          Mức chắc chắn trung bình của model trong tháng, thang 0–1. Tụt thấp là dấu hiệu
          model gặp loại văn bản nó không quen — xem lại trước khi tin số.
      - name: so_bi_cat
        description: Số bản ghi dài quá giới hạn token, chỉ được chấm trên phần đầu.
      - name: so_uoc_luong_ngay
        description: >
          Số bản ghi không có ngày đăng, phải lùi về lần đầu hệ thống nhìn thấy. Muộn hơn
          thực tế nhưng không bao giờ sớm hơn.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [thang, phien_ban_model]

  - name: mart__share_of_voice
    description: >
      Thị phần thảo luận trên báo chí theo tháng, chỉ tính earned media (bài do báo
      ngoài viết, loại bài trên kênh của chính Học viện). Chỉ có nghĩa khi mỗi trường
      được thu thập bằng cùng một số lượng từ khoá tìm kiếm.
    columns:
      - name: thang
        description: Tháng đăng bài, cắt về ngày đầu tháng.
        tests: [not_null]
      - name: ma_truong
        tests: [not_null]
      - name: so_lan_nhac
        description: >
          Số lần trường được nhắc. Một bài so sánh nhắc nhiều trường được đếm cho từng
          trường — đây là số LẦN NHẮC, không phải số bài.
        tests: [not_null]
      - name: so_dau_bao
        description: Số đầu báo khác nhau đã nhắc tới trường trong tháng.
      - name: thi_phan_pct
        description: Tỷ trọng số lần nhắc trong tổng của cả nhóm, cùng tháng.
      - name: la_hoc_vien
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [thang, ma_truong]

  - name: mart__news_sentiment
    description: >
      Sắc thái tin bài BÁO NGOÀI viết về Học viện, theo tháng. Hợp đồng dữ liệu với
      backend cho chỉ số `positive_sentiment_share`.

      Đã loại thông cáo do chính Học viện đăng, và chỉ giữ bài có nhãn thương hiệu `ptit`
      — kho tin bài phục vụ cả nhóm sáu trường đối sánh, không lọc thì sắc thái bài về
      trường khác bị tính thành sắc thái về Học viện.

      Bài chưa qua bước gán nhãn (`crawler gan-nhan`) không có mặt ở đây. Thà thiếu bài
      còn hơn tính nhầm bài của trường khác.
    columns:
      - name: thang
        description: Ngày đầu tháng báo cáo.
        tests: [not_null]
      - name: phien_ban_model
        description: >
          Model và bản trọng số đã sinh ra các điểm này. PhoBERT cho tin bài, khác model
          dùng cho mạng xã hội — không so trực tiếp hai chỉ số như thể cùng thang đo.
        tests: [not_null]
      - name: so_tin_bai
        description: Mẫu số. Phải hiển thị kèm mọi tỷ lệ phần trăm.
        tests: [not_null]
      - name: so_tich_cuc
        tests: [not_null]
      - name: so_trung_tinh
        tests: [not_null]
      - name: so_tieu_cuc
        tests: [not_null]
      - name: so_dau_bao
        description: >
          Số đầu báo khác nhau trong tháng. Một tháng 20 bài nhưng chỉ 2 đầu báo là độ
          phủ hẹp, đọc khác hẳn 20 bài trên 15 đầu báo.
      - name: ty_le_tich_cuc_pct
        description: Tin bài tích cực trên tổng, đơn vị %.
      - name: ty_le_tieu_cuc_pct
        description: Tin bài tiêu cực trên tổng, đơn vị %.
      - name: do_chac_chan_tb
        description: Mức chắc chắn trung bình của model trong tháng, thang 0–1.
      - name: so_bi_cat
        description: >
          Số bài dài quá 256 token, chỉ được chấm trên tiêu đề và phần đầu. Với tin tức
          thì lập trường thường nằm ở đó, nhưng con số này phải hiện ra để tự đánh giá.
      - name: so_uoc_luong_ngay
        description: Số bài không có ngày đăng, phải lùi về thời điểm chấm.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [thang, phien_ban_model]

  - name: mart__admission_score_benchmark
    description: >
      Điểm chuẩn bình quân theo trường và năm. Giữ cả số ngành và độ trải vì bình quân
      của hai trường có cơ cấu ngành khác nhau không so trực tiếp được.
    columns:
      - name: ma_truong
        tests: [not_null]
      - name: nam
        tests: [not_null]
      - name: so_nganh
        tests: [not_null]
      - name: diem_binh_quan
        description: Bình quân không trọng số của các ngành, thang 30.
        tests: [not_null]
      - name: du_nganh
        description: >
          Đúng khi trường có từ 10 ngành trở lên. Bình quân trên vài ngành lẻ không đại
          diện cho trường — tầng đọc phải lọc theo cột này.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ma_truong, nam]

  - name: mart__social_mention
    description: >
      Từng ý kiến của người ngoài về Học viện, một dòng một ý kiến, kèm sắc thái.
      Hợp đồng dữ liệu cho trang "Lắng nghe".

      Bên cạnh mart__social_sentiment (tỷ lệ) chứ không thay thế nó: tỷ lệ trả lời "dư
      luận tốt hay xấu", mart này trả lời "họ nói GÌ". Con số 6% tiêu cực không cho ai
      biết phải sửa cái gì; sáu câu tiêu cực đọc được thì có.

      Tác giả đã ẩn danh từ lúc thu thập nên không có cột nào chứa danh tính.
    columns:
      - name: ma_thao_luan
        description: Khoá tự nhiên, băm của (nền tảng, định danh gốc).
        tests: [not_null, unique]
      - name: nen_tang
        description: Nền tảng nguồn.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [youtube, reddit, forum]
      - name: ten_nguon
        description: Kênh YouTube, subreddit hoặc tên miền diễn đàn.
        tests: [not_null]
      - name: hat_du_lieu
        description: >
          Loại nội dung. Chỉ có ba giá trị mang ý kiến — `video` đã bị loại từ tầng
          intermediate vì tiêu đề video là lời giới thiệu, không phải nhận xét.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [comment, post, thread]
      - name: duong_dan
        description: >
          Link về đúng bình luận gốc. Người xem phải kiểm chứng được mọi câu hiển thị
          trên dashboard — không có link thì con số không tra ngược được.
      - name: noi_dung
        description: Nguyên văn, không cắt. Việc cắt là của tầng trình bày.
        tests: [not_null]
      - name: sac_thai
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, neutral, negative]
      - name: do_chac_chan
        description: >
          Mức chắc chắn của model, thang 0–1. Dưới 0,6 thì nên đọc câu gốc trước khi tin
          nhãn — đó là lý do cột này lên tới tận giao diện.
        tests: [not_null]
      - name: thu_tu_uu_tien
        description: >
          0 tiêu cực · 1 trung tính · 2 tích cực. Sắp theo cột này trước rồi mới tới lượt
          thích: dashboard sắp theo thời gian sẽ chôn lời phàn nàn quan trọng nhất xuống
          dưới mười lời khen đăng sau nó.
        tests: [not_null]
      - name: da_bi_cat
        description: Nội dung dài quá giới hạn token, điểm chỉ tính trên phần đầu.
