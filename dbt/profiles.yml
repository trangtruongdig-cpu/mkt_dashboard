# Đọc toàn bộ từ biến môi trường — không có mật khẩu nào nằm trong file này nên
# commit được. Biến lấy từ .env gốc của Docker Compose.
#
# Chạy:  cd dbt && dbt build
ptit_dashboard:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'ptit') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'ptit_dashboard') }}"
      # dbt nối tên lược đồ đích vào sau giá trị này, nên để trống chuỗi rỗng thì
      # `+schema: stg` cho ra đúng lược đồ `stg` chứ không phải `public_stg`.
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: 4
