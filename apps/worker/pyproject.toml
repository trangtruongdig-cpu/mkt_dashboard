[project]
name = "ptit-worker"
version = "0.1.0"
description = "Worker batch: hút dữ liệu marketing số về kho, chấm sắc thái tiếng Việt"
requires-python = ">=3.12,<3.13"
# Giấy phép ghi kèm để phục vụ hồ sơ nghiệm thu — mọi thư viện đều thuộc nhóm cho phép.
dependencies = [
    "airbyte>=0.20.0",       # MIT      — PyAirbyte, chạy connector Airbyte không cần Docker
    "apscheduler>=3.11.3",   # MIT      — lịch chạy nền trong container worker
    "duckdb>=1.4.3",         # MIT      — kho cục bộ khi chưa dựng PostgreSQL
    "feedparser>=6.0.12",    # BSD-2    — đọc RSS/Atom của các báo và công cụ tìm kiếm
    "news-please>=1.6.16",   # Apache-2 — bóc toàn văn bài báo
    "psycopg[binary]>=3.3.4", # LGPL-3  — trình điều khiển PostgreSQL, dùng qua thư viện
                              #           không sửa mã nguồn nên LGPL không lan sang dự án
    "python-dotenv>=1.0.1",  # BSD-3    — nạp biến môi trường từ .env
    # Google KHÔNG có API chính thức cho Trends; pytrends gọi endpoint nội bộ của trang
    # web nên có thể hỏng khi Google đổi giao diện. Rủi ro được nhốt gọn trong
    # ingest/trends_client.py — thay thư viện khác chỉ phải sửa đúng file đó.
    "pytrends>=4.9.2",       # Apache-2 — chỉ số quan tâm tìm kiếm theo tuần
    # --- Chấm sắc thái tiếng Việt ---
    # Chạy trên CPU. Không cài bản CUDA: máy chủ Học viện không có GPU, và kết quả phải
    # tái lập được — cùng một câu, chạy ở đâu cũng phải ra cùng một điểm.
    "torch>=2.13.0",         # BSD-3    — chỉ dùng để suy luận, không huấn luyện
    # KHÔNG nâng lên nhánh 5.x. transformers 5.14 làm hỏng tokenizer XLM-R của ViSoBERT:
    # `Tokenizer(Unigram(vocab=dict))` ném TypeError vì đổi kiểu tham số. Model ViSoBERT
    # không kèm sẵn tokenizer.json nên buộc phải đi đường chuyển đổi từ sentencepiece —
    # đúng đường đã hỏng. Kiểm chứng lại trước khi gỡ trần này.
    "transformers>=4.44,<5", # Apache-2 — nạp và chạy model sắc thái
    "sentencepiece>=0.2.2",  # Apache-2 — bộ tách từ con của XLM-R, ViSoBERT cần
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    # Chỉ dùng cho script lấy refresh token, không cần khi chạy hút dữ liệu.
    "google-auth-oauthlib>=1.2.1",
    "pip>=26.1.2",
]

# torch bản mặc định trên PyPI dành cho Linux kéo theo TOÀN BỘ thư viện CUDA của NVIDIA
# (nvidia-cublas, cusparselt, cudnn…) — vài GB cho một máy chủ không có GPU. Ép dùng chỉ
# mục CPU của PyTorch cho Linux; máy dev macOS vẫn lấy bản mặc định vì bản arm64 trên PyPI
# đã là CPU/MPS sẵn và chỉ mục cpu không có wheel cho macOS.
#
# Mục 8 CLAUDE.md: ảnh runtime dùng base -slim, không chứa toolchain build. Kéo mấy GB
# thư viện GPU vào ảnh của một máy chủ không GPU đi ngược đúng tinh thần đó.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "airbyte.*",
    "google_auth_oauthlib.*",
    "feedparser.*",
    "newsplease.*",
    "pytrends.*",
    "apscheduler.*",
]
ignore_missing_imports = true

# transformers có type hint nhưng chưa phủ hết: `AutoTokenizer.from_pretrained` bị coi là
# hàm không kiểu, và mypy strict từ chối mọi lệnh gọi tới nó.
#
# Nới đúng một luật, đúng một file. `nlp/model.py` là nơi DUY NHẤT trong dự án chạm vào
# transformers — chính vì đã gom lại một chỗ nên ngoại lệ này mới hẹp được đến vậy.
# Mọi luật khác của strict vẫn áp dụng cho file đó, và phần còn lại của dự án không đổi.
[[tool.mypy.overrides]]
module = ["nlp.model"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
